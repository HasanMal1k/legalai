# Qdrant (the vector database) for the Pakistan Law Assistant: data under data\qdrant, reachable only from this PC.
# Started by run_app.ps1 (from tools\qdrant, which the paths below are relative to); dashboard at http://127.0.0.1:6333/dashboard
storage:
  storage_path: ../../data/qdrant/storage
  snapshots_path: ../../data/qdrant/snapshots
service:
  host: 127.0.0.1
  http_port: 6333
  grpc_port: 6334
telemetry_disabled: true
